; Settings changed in the in-game menu are kept in SeamlessSkyrim_User.ini next to this file, which
; wins over this one per key and is never replaced by an update.
[Portals]
; 1 = show the interior behind load doors when you approach them from outside, and walk through
; them by walking into the doorway. Read at startup: with 0 the mod installs no hooks, and the
; in-game menu can't switch it on until the game is restarted.
bEnabled=1

; A door opens when you use it (no loading screen) or an NPC reaches for it, and shuts a few
; seconds after nobody stands in it. City gates and the doors set to always open in the in-game
; menu stand open. 0 = so; 1 = every door stands open, locked ones too; 2 = every door stays shut
; until used, gates and always-open doors too. Also in the in-game menu.
iForceDoors=0

; The reach of a door (game units): the space behind it starts loading 300 units further out and
; is let go 700 units further out. Also in the in-game menu. A door opened before that space has
; loaded shows a picture of what was last seen through it (kept in SeamlessSkyrim_Doorways
; next to this file), or a plain colour, until it has.
iDoorOpenDistance=450

; Height in texels of that picture across the doorway (its width is three quarters of it), 32 to
; 1024. Larger is sharper but costs more disk and video memory per door. A door into a room has a
; picture reaching past the doorway: 512 is 9.6 MB, 1024 is 38 MB. A door to the outdoors keeps
; one of the doorway alone per part of the day: 512 is 1.5 MB. A room's depth images (below) are
; the same height each. Also in the in-game menu.
iDoorwayPictureHeight=512

; The pictures kept on disk (SeamlessSkyrim_Doorways) are held to this many megabytes, 64 to
; 32768; the ones used longest ago are deleted first.
iDoorwayCacheMB=2048

; Views taken from just inside each doorway for a doorway's depth image, 1 to 3: more of them
; show more of what furniture hides when walking past at an angle. 0 = no depth images.
iDoorwayDepthLayers=3

; Rooms behind the nearest other doors that are kept loaded out of sight besides the room at the
; door you are at, 0 to 6. They are paused (not simulated, not drawn, their lights not updated), so
; their doorway opens at once when you walk up, and only the room whose door is open and near runs.
; Each costs memory and a short frame when it is loaded. 0 = only the door you are at. Also in the
; in-game menu.
iLoadedRooms=2

; What the rooms kept loaded and the doorway pictures may take together, in MB, by the plugin's own
; estimate (a loaded room ~120 MB), 128 to 4096. The least likely room gives way first. Also in the
; in-game menu.
iHeldMemoryMB=640

; A room is made live (simulated and drawn) only while the main thread's frame work leaves room
; for it at this frame rate, 15 to 240. Below it a door keeps to its picture, and the engine's own
; door with its loading screen takes over where a room is not ready in time. Also in the in-game menu.
iTargetFrameRate=30

; 1 = seen from outdoors, the room behind an open door is drawn into the world by the game itself,
; lit by its own lights. 0 = it is drawn as a picture in the doorway. Also in the in-game menu.
bMerge=1

; Seen from indoors, the street is drawn by the game itself (with its sky, distant land and the
; sun's shadows) instead of by this plugin's picture.
bMergeOutdoors=1

; 1 = while you are indoors, the street's physics run, so the people seen out there walk. Also in
; the in-game menu.
bStepExteriorFromInside=1

; Seen from outdoors, the room behind a door is drawn only as far as it can be seen through the
; doorway: 2 = shape by shape, 1 = all or nothing (left out while the doorway is off screen, the
; door shut or you are beside or behind the house), 0 = drawn whole and masked (slower).
iMergedCull=2

[Audio]
; 1 = the room behind an open door is heard through its doorway (its ambience, fires and other
; sound sources, the street's weather from indoors), quieter and duller with distance and angle, and
; gone when the door shuts. Only the live room, only while its door is open. Also in the in-game menu.
bDoorwaySound=1

; How loud, in percent, 0 to 100. Also in the in-game menu.
iDoorwaySoundVolume=70
